name: Sync Team & Project Data

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grant write access for commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}  # Use PAT instead of default GITHUB_TOKEN

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tsx globally
        run: npm install -g tsx

      - name: Run data sync
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GIUSEPPI_GITHUB_TOKEN: ${{ secrets.GIUSEPPI_GITHUB_TOKEN }}
          JOHNNY_GITHUB_TOKEN: ${{ secrets.JOHNNY_GITHUB_TOKEN }}
          ANDREW_GITHUB_TOKEN: ${{ secrets.ANDREW_GITHUB_TOKEN }}
          DYLAN_GITHUB_TOKEN: ${{ secrets.DYLAN_GITHUB_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: tsx scripts/sync-data.ts

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/teamStats.ts src/data/projects.ts src/data/roadmaps.ts
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update team stats, project dev logs, and roadmaps [skip ci]" && git push)
